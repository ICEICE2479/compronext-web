services:
  compronext-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: compronext-web:latest
    container_name: compronext-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
